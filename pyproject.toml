[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geolens"
version = "0.1.0"
description = "GeoLens - retrieval-first visual geo-localization with explainability (MSLS-val Copenhagen + San Francisco MVP)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Runtime dependencies. Heavy ML libs (torch/faiss/gradio) are declared here
# because the architecture is fixed; they are imported lazily inside the
# sprints that need them (S1 embedding, S3 XAI, S4 frontend).
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "faiss-cpu>=1.8",
    # Required by the serizba/salad hub model: VPRModel subclasses LightningModule
    # and its __init__ instantiates a metric-learning loss even for inference.
    "pytorch-lightning>=2.2",
    "pytorch-metric-learning>=2.3",
    "huggingface-hub>=0.23",
    "gradio>=4.36",
    "folium>=0.17",
    "grad-cam>=1.5",
    "pandas>=2.2",
    # The Gradio UI calls the FastAPI backend over HTTP (docs/architecture/
    # 05-frontend.md); httpx is that client (also used by the test suite).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ---------------------------------------------------------------------------
# Ruff (lint + format) - single tool replacing Black + isort + flake8.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "scripts", "tests", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C4", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI's dependency-injection markers are called in argument defaults by
# design; they are effectively immutable, so exempt them from B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# mypy (static typing) - public API must be typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = false
files = ["backend/app", "scripts", "frontend"]
mypy_path = "backend"

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "cv2.*",
    "gradio.*",
    "folium.*",
    "pytorch_grad_cam.*",
    "torchvision.*",
    "pandas.*",
    "sklearn.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"
